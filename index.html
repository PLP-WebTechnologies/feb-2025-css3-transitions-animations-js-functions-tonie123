<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Animations & Preferences</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Animations</h1>
        
        <div class="preferences-section">
            <h2>Theme Preferences</h2>
            <button id="themeToggle" class="animated-button">Toggle Theme</button>
        </div>

        <div class="animation-section">
            <div class="animated-box" id="animatedBox"></div>
            <button id="triggerAnimation" class="animated-button">Trigger Animation</button>
        </div>

        <div class="color-preferences">
            <h2>Color Preferences</h2>
            <input type="color" id="colorPicker" value="#3498db">
            <button id="saveColor" class="animated-button">Save Color</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
